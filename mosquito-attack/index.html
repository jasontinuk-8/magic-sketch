(()=>{'use strict';const $=s=>document.querySelector(s),canvas=$('#canvas'),ctx=canvas.getContext('2d'),stage=$('#stage'),overlay=$('#overlay'),headline=$('#headline'),description=$('#description'),start=$('#start'),pause=$('#pause'),sound=$('#sound'),ranking=$('#ranking'),scoreEl=$('#score'),timeEl=$('#time'),bestEl=$('#best'),countEl=$('#count'),electricBtn=$('#electric'),electricFlash=$('#electricFlash');let electricMode=false,electricLeft=0,pickup=null,pickupClock=0,zaps=[];let sweepPointer=null,sweepPos=null,sweepSoundClock=0,sweepFlashClock=0;let W=1,H=1,dpr=1,bugs=[],effects=[],splats=[],score=0,elapsed=0,spawnClock=0,last=0,state='menu',limit=24,muted=false,previousState='menu',audio=null,buzzVoices=[],entryPending=false;const storeKey='mosquito-attack-1.1-board';let board=[];try{board=JSON.parse(localStorage.getItem(storeKey)||'[]');if(!Array.isArray(board))board=[]}catch{board=[]}const rand=(a,b)=>a+Math.random()*(b-a),clamp=(v,a,b)=>Math.max(a,Math.min(b,v));function best(){return board.length?Math.max(...board.map(x=>Number(x.score)||0)):0}function updateElectricUI(){electricBtn.textContent=electricMode?'⚡ 電蚊拍 '+Math.ceil(electricLeft)+'s':'⚡ 等待道具';electricBtn.classList.toggle('electric-on',electricMode);electricBtn.setAttribute('aria-pressed',String(electricMode))}function updateUI(){scoreEl.textContent=score;timeEl.textContent=Math.floor(elapsed)+'s';countEl.textContent=bugs.length+'/'+limit;bestEl.textContent=Math.max(score,best())}function resize(){const r=canvas.getBoundingClientRect();W=Math.max(1,r.width);H=Math.max(1,r.height);dpr=Math.min(devicePixelRatio||1,2);canvas.width=Math.round(W*dpr);canvas.height=Math.round(H*dpr);ctx.setTransform(dpr,0,0,dpr,0,0);bugs.forEach(b=>{b.x=clamp(b.x,b.r,W-b.r);b.y=clamp(b.y,b.r,H-b.r)})}new ResizeObserver(resize).observe(stage);const types=[{kind:'normal',r:10,speed:1,points:10,body:'#3e4b43',wing:'#c1d6ce'},{kind:'fast',r:8,speed:1.8,points:20,body:'#ad5d44',wing:'#f0d4a9'},{kind:'giant',r:15,speed:.67,poin function render(t){ctx.clearRect(0,0,W,H);ctx.fillStyle='#a2cfa566';for(let i=0;i<12;i++){const x=(i*131+31)%W,y=(i*79+63)%H;ctx.beginPath();ctx.arc(x,y,2.5,0,Math.PI*2);ctx.fill()}for(const splat of splats)drawSplat(splat);for(const b of [...bugs].sort((a,b)=>a.depth-b.depth))drawBug(b,t);drawPickup(t);for(const z of zaps)drawZap(z);if(electricMode&&sweepPos){ctx.save();ctx.strokeStyle='#e8fbff';ctx.fillStyle='#a7edff22';ctx.lineWidth=3;ctx.shadowColor='#80eaff';ctx.shadowBlur=12;ctx.beginPath();ctx.arc(sweepPos.x,sweepPos.y,Math.max(46,Math.min(W,H)*.105),0,Math.PI*2);ctx.fill();ctx.stroke();ctx.restore()}for(const e of effects){const a=Math.max(0,1-e.t/.45);ctx.globalAlpha=a;ctx.strokeStyle=e.hit?'#cf7845':'#648d72';ctx.lineWidth=e.hit?4:2;ctx.beginPath();ctx.arc(e.x,e.y,7+e.t*45,0,Math.PI*2);ctx.stroke();if(e.hit){ctx.fillStyle='#ad4e2b';ctx.font='bold 18px system-ui';ctx.textAlign='center';ctx.fillText('+'+e.points,e.x,e.y-20-e.t*30)}ctx.globalAlpha=1}}function frame(ts){const dt=Math.min((ts-last)/1000||0,.05);last=ts;if(state==='playing'){elapsed+=dt;spawnClock+=dt;if(electricMode){electricLeft-=dt;if(electricLeft<=0){electricMode=false;electricLeft=0;sweepPointer=null;sweepPos=null}updateElectricUI()}if(electricMode&&sweepPos&&sweepPointer!==null){zapAt(sweepPos.x,sweepPos.y,true)}if(pickup){pickup.phase+=dt*2;pickup.x+=pickup.vx*dt;pickup.y+=Math.sin(pickup.phase)*dt*13;if(pickup.x<-50||pickup.x>W+50)pickup=null}else if(!electricMode){pickupClock-=dt;if(pickupClock<=0){const left=Math.random()<.5;pickup={x:left?-32:W+32,y:rand(65,Math.max(70,H-65)),vx:(left?1:-1)*rand(27,43),phase:0};pickupClock=rand(14,22)}}const interval=Math.max(.19,2.15-elapsed*.028);while(spawnClock>=interval){spawnClock-=interval;spawn();if(elapsed>35&&Math.random()<.22)spawn()}for(const b of bugs){b.phase+=dt*b.wiggle;b.depth+=b.depthVelocity*dt;if(b.depth>.98){b.depth=.98;b.depthVelocity=-Math.abs(b.depthVelocity)}if(b.depth<.12){b.depth=.12;b.depthVelocity=Math.abs(b.depthVelocity)}b.bank=clamp(b.vx/150,-.65,.65);b.x+=(b.vx+Math.sin(b.phase*3)*12)*dt;b.y+=(b.vy+Math.cos(b.phase*2.5)*12)*dt;if(b.x<b.r){b.x=b.r;b.vx=Math.abs(b.vx)}if(b.x>W-b.r){b.x=W-b.r;b.vx=-Math.abs(b.vx)}if(b.y<b.r){b.y=b.r;b.vy=Math.abs(b.vy)}if(b.y>H-b.r){b.y=H-b.r;b.vy=-Math.abs(b.vy)}}effects.forEach(e=>e.t+=dt);effects=effects.filter(e=>e.t<.45);zaps.forEach(z=>z.t+=dt);zaps=zaps.filter(z=>z.t<.24);splats.forEach(s=>s.t+=dt);splats=splats.filter(s=>s.t<s.life);updateUI();if(bugs.length>=limit)finish();setBuzz()}render(ts/1000);requestAnimationFrame(frame)}document.addEventListener('visibilitychange',()=>{if(document.hidden&&state==='playing')pauseGame()});resize();updateUI();requestAnimationFrame(frame)})();

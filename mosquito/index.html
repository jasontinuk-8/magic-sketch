<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#173a30"><title>Mosquito Attack 1.2 — Spatial Buzz</title><style>
*{box-sizing:border-box}html,body{margin:0;height:100%;font-family:system-ui,-apple-system,sans-serif;background:#173a30;color:#fff6da}button,select,input{font:inherit}button{cursor:pointer;touch-action:manipulation}.app{height:100dvh;max-width:1100px;margin:auto;padding:8px;display:flex;flex-direction:column;gap:7px}.top{display:flex;align-items:center;justify-content:space-between;gap:8px}.brand{font-weight:900;font-size:clamp(15px,3.3vw,25px);white-space:nowrap}.stats{display:flex;gap:5px}.stat{background:#315b4b;border-radius:10px;padding:4px 8px;min-width:54px;text-align:center}.stat small{display:block;font-size:9px;opacity:.8}.stat b{font-size:clamp(12px,2.6vw,19px);font-variant-numeric:tabular-nums}.stage{position:relative;flex:1;min-height:0;background:linear-gradient(145deg,#e9f3d5,#b9dfbf);border:4px solid #71987b;border-radius:16px;overflow:hidden;touch-action:none}canvas{width:100%;height:100%;display:block;touch-action:none}.overlay{position:absolute;inset:0;background:#12382be8;display:flex;align-items:center;justify-content:center;padding:12px;overflow:auto}.panel{width:min(100%,440px);text-align:center;margin:auto}.panel h1{margin:0 0 8px;font-size:clamp(23px,5vw,36px)}.panel p{line-height:1.45;margin:8px 0}.btn{border:0;border-radius:11px;padding:11px 18px;background:#f2c36b;color:#243b2e;font-weight:900}.btn.secondary{background:#3e705a;color:#fff;padding:8px 12px;font-size:13px}.btn:disabled{opacity:.4}.row{display:flex;gap:8px;justify-content:center;align-items:center;flex-wrap:wrap;margin:10px 0}.choice{background:#315d4b;color:white;border:2px solid #739b82;border-radius:9px;padding:8px 10px;font-weight:800}.choice.selected{background:#f2c36b;border-color:#f2c36b;color:#26392c}.footer{display:flex;align-items:center;justify-content:space-between;gap:7px}.hint{font-size:11px;opacity:.8}.actions{display:flex;gap:5px}.hidden{display:none!important}.board{background:#214b3c;border:1px solid #729b79;border-radius:12px;padding:10px;text-align:left;max-height:min(50dvh,350px);overflow:auto}.board table{width:100%;border-collapse:collapse;font-size:12px}.board th,.board td{padding:7px 3px;border-bottom:1px solid #547b65;text-align:left}.board th{color:#f2c36b}.entry{width:100%;max-width:260px;padding:10px;border-radius:8px;border:2px solid #9ab8a0;background:#f9f8e9;color:#193e2d}.legend{font-size:12px;color:#dce9d8}.pill{display:inline-block;padding:2px 6px;border-radius:6px;background:#315d4b;margin:2px}.warning{color:#f5c67c;font-weight:700}@media(max-width:620px){.app{padding:5px;gap:4px}.brand{font-size:13px}.stat{min-width:42px;padding:4px}.stat small{font-size:8px}.stat b{font-size:12px}.hint{max-width:47%;font-size:10px}.btn.secondary{padding:7px 8px;font-size:12px}}@media(orientation:landscape) and (max-height:480px){.top{height:31px}.footer{height:30px}.overlay{align-items:flex-start}.panel h1{font-size:22px}.panel p{font-size:12px;margin:3px}.row{margin:5px}.choice{padding:5px 9px}.btn{padding:7px 15px}}
</style></head><body><main class="app"><header class="top"><div class="brand">🦟 MOSQUITO ATTACK</div><div class="stats"><div class="stat"><small>SCORE</small><b id="score">0</b></div><div class="stat"><small>TIME</small><b id="time">0s</b></div><div class="stat"><small>BEST</small><b id="best">0</b></div><div class="stat"><small>蚊</small><b id="count">0/24</b></div></div></header><section class="stage" id="stage"><canvas id="canvas" aria-label="打蚊遊戲畫面"></canvas><div class="overlay" id="overlay"><div class="panel"><h1 id="headline">🦟 打蚊大作戰</h1><div id="description"><p>點擊飛緊嘅蚊！越玩越多、越飛越快。</p><div class="legend"><span class="pill">普通蚊 +10</span><span class="pill">快蚊 +20</span><span class="pill">大蚊 +30</span></div><p>揀你想挑戰嘅蚊數上限：</p><div class="row" id="limits"><button class="choice selected" data-limit="24">24</button><button class="choice" data-limit="50">50</button><button class="choice" data-limit="80">80</button><button class="choice" data-limit="100">100</button></div></div><button class="btn" id="start">▶ START GAME</button></div></div></section><footer class="footer"><span class="hint">👆 點蚊得分 · 🦟 細蚊 · 🎧 戴耳機聽立體聲</span><div class="actions"><button class="btn secondary" id="sound" aria-pressed="true">🔊 音效</button><button class="btn secondary" id="ranking">🏆 排行榜</button><button class="btn secondary" id="pause">暫停</button></div></footer></main><script>
(()=>{'use strict';const $=s=>document.querySelector(s),canvas=$('#canvas'),ctx=canvas.getContext('2d'),stage=$('#stage'),overlay=$('#overlay'),headline=$('#headline'),description=$('#description'),start=$('#start'),pause=$('#pause'),sound=$('#sound'),ranking=$('#ranking'),scoreEl=$('#score'),timeEl=$('#time'),bestEl=$('#best'),countEl=$('#count');let W=1,H=1,dpr=1,bugs=[],effects=[],score=0,elapsed=0,spawnClock=0,last=0,state='menu',limit=24,muted=false,previousState='menu',audio=null,buzzVoices=[],entryPending=false;const storeKey='mosquito-attack-1.1-board';let board=[];try{board=JSON.parse(localStorage.getItem(storeKey)||'[]');if(!Array.isArray(board))board=[]}catch{board=[]}const rand=(a,b)=>a+Math.random()*(b-a),clamp=(v,a,b)=>Math.max(a,Math.min(b,v));function best(){return board.length?Math.max(...board.map(x=>Number(x.score)||0)):0}function updateUI(){scoreEl.textContent=score;timeEl.textContent=Math.floor(elapsed)+'s';countEl.textContent=bugs.length+'/'+limit;bestEl.textContent=Math.max(score,best())}function resize(){const r=canvas.getBoundingClientRect();W=Math.max(1,r.width);H=Math.max(1,r.height);dpr=Math.min(devicePixelRatio||1,2);canvas.width=Math.round(W*dpr);canvas.height=Math.round(H*dpr);ctx.setTransform(dpr,0,0,dpr,0,0);bugs.forEach(b=>{b.x=clamp(b.x,b.r,W-b.r);b.y=clamp(b.y,b.r,H-b.r)})}new ResizeObserver(resize).observe(stage);const types=[{kind:'normal',r:10,speed:1,points:10,body:'#3e4b43',wing:'#c1d6ce'},{kind:'fast',r:8,speed:1.8,points:20,body:'#ad5d44',wing:'#f0d4a9'},{kind:'giant',r:15,speed:.67,points:30,body:'#5c4b7d',wing:'#d4c4e5'}];function spawn(){let pick=Math.random(),type=elapsed<9?types[0]:pick<.58?types[0]:pick<.85?types[1]:types[2];const r=type.r,side=Math.floor(rand(0,4)),x=side===0?-r:side===1?W+r:rand(r,Math.max(r,W-r)),y=side===2?-r:side===3?H+r:rand(r,Math.max(r,H-r)),angle=Math.atan2(H/2-y,W/2-x)+rand(-.9,.9),speed=(rand(47,75)+Math.min(140,elapsed*1.35))*type.speed;bugs.push({x,y,vx:Math.cos(angle)*speed,vy:Math.sin(angle)*speed,r,phase:rand(0,6),wiggle:rand(2,4),type})}function initAudio(){if(muted)return;try{const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;if(!audio)audio=new AC();if(audio.state==='suspended')audio.resume();if(!buzzVoices.length){for(let i=0;i<6;i++){const osc=audio.createOscillator(),filter=audio.createBiquadFilter(),gain=audio.createGain(),pan=audio.createStereoPanner?audio.createStereoPanner():null;osc.type=i%2?'triangle':'sawtooth';osc.frequency.value=145+i*18;filter.type='lowpass';filter.frequency.value=540;gain.gain.value=0;osc.connect(filter);filter.connect(gain);if(pan){gain.connect(pan);pan.connect(audio.destination)}else gain.connect(audio.destination);osc.start();buzzVoices.push({osc,gain,pan})}}}catch{}}
function setBuzz(){if(!audio||!buzzVoices.length)return;const on=state==='playing'&&!muted,n=bugs.length,t=audio.currentTime;const active=on?Math.min(6,Math.max(1,Math.ceil(n/5))):0;for(let i=0;i<buzzVoices.length;i++){const v=buzzVoices[i],group=bugs.filter((_,j)=>j%6===i),count=group.length;const amount=i<active?Math.min(.045,.013+Math.sqrt(n)*.0035)/Math.sqrt(active):0;v.gain.gain.setTargetAtTime(amount,t,.13);v.osc.frequency.setTargetAtTime(135+i*23+Math.min(85,n)*.7+Math.sin(elapsed*(3+i*.35))*16,t,.12);if(v.pan){const x=count?group.reduce((sum,b)=>sum+b.x,0)/count:W*(i+.5)/6;v.pan.pan.setTargetAtTime(clamp(x/Math.max(1,W)*2-1,-.95,.95),t,.16)}}}
function popSound(kind){if(!audio||muted)return;try{const t=audio.currentTime,o=audio.createOscillator(),g=audio.createGain();o.type='triangle';o.frequency.setValueAtTime(kind==='giant'?190:320,t);o.frequency.exponentialRampToValueAtTime(kind==='giant'?65:100,t+.11);g.gain.setValueAtTime(.23,t);g.gain.exponentialRampToValueAtTime(.001,t+.13);o.connect(g);g.connect(audio.destination);o.start(t);o.stop(t+.14)}catch{}}
function stopAudio(){if(!audio)return;for(const v of buzzVoices)v.gain.gain.setTargetAtTime(0,audio.currentTime,.04)}
function show(h,html,button){headline.textContent=h;description.innerHTML=html;start.textContent=button;overlay.classList.remove('hidden')}function hide(){overlay.classList.add('hidden')}function reset(){initAudio();bugs=[];effects=[];score=0;elapsed=0;spawnClock=0;entryPending=false;state='playing';hide();pause.textContent='暫停';for(let i=0;i<2;i++)spawn();updateUI();setBuzz()}function pauseGame(){if(state==='playing'){state='paused';show('⏸ 已暫停','<p>準備好就繼續打蚊！</p>','▶ 繼續');pause.textContent='繼續';stopAudio()}else if(state==='paused'){state='playing';hide();pause.textContent='暫停';initAudio();setBuzz()}}function escapeHTML(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function finish(){state='over';stopAudio();entryPending=true;show('GAME OVER!',`<p>你打中蚊，獲得 <b>${score}</b> 分！<br>生存 <b>${Math.floor(elapsed)}</b> 秒 · 上限 ${limit} 隻</p><p>輸入名字，登上本機排行榜：</p><input class="entry" id="playerName" maxlength="16" placeholder="玩家名稱" value="Player" autocomplete="nickname"><div class="row"><button class="btn" id="saveScore">🏆 儲存成績</button><button class="btn secondary" id="skipScore">跳過</button></div>`,'↻ 再玩一次');$('#saveScore').addEventListener('click',saveScore);$('#skipScore').addEventListener('click',()=>{entryPending=false;description.innerHTML='<p>準備好再挑戰一次？</p>'});$('#playerName').addEventListener('keydown',e=>{if(e.key==='Enter')saveScore()});updateUI()}function saveScore(){if(!entryPending)return;entryPending=false;let name=($('#playerName')?.value||'Player').trim().slice(0,16)||'Player';board.push({name,score,seconds:Math.floor(elapsed),limit,date:new Date().toISOString()});board.sort((a,b)=>b.score-a.score||b.seconds-a.seconds);board=board.slice(0,10);try{localStorage.setItem(storeKey,JSON.stringify(board))}catch{}updateUI();description.innerHTML='<p>成績已儲存喺呢個瀏覽器！</p>'+boardHTML()}function boardHTML(){return '<div class="board"><table><thead><tr><th>#</th><th>玩家</th><th>分數</th><th>時間</th><th>上限</th></tr></thead><tbody>'+ (board.length?board.map((r,i)=>`<tr><td>${i+1}</td><td>${escapeHTML(r.name)}</td><td>${Number(r.score)||0}</td><td>${Number(r.seconds)||0}s</td><td>${Number(r.limit)||24}</td></tr>`).join(''):'<tr><td colspan="5">未有成績，快啲開始！</td></tr>')+'</tbody></table></div><p class="legend">排行榜只儲存喺目前裝置／瀏覽器。</p>'}function showBoard(){if(state==='playing'){previousState='playing';state='board';stopAudio()}else previousState=state;show('🏆 TOP 10 排行榜',boardHTML(),previousState==='playing'?'▶ 返回遊戲':'← 返回');}function backBoard(){if(previousState==='playing'){state='playing';hide();setBuzz()}else if(previousState==='paused'){state='paused';show('⏸ 已暫停','<p>準備好就繼續打蚊！</p>','▶ 繼續')}else if(previousState==='over'){state='over';show('GAME OVER!','<p>再試一次，挑戰最高分！</p>','↻ 再玩一次')}else{state='menu';show('🦟 打蚊大作戰',menuHTML(),'▶ START GAME');bindLimits()}}function menuHTML(){return `<p>點擊飛緊嘅蚊！越玩越多、越飛越快。</p><div class="legend"><span class="pill">普通蚊 +10</span><span class="pill">快蚊 +20</span><span class="pill">大蚊 +30</span></div><p>揀你想挑戰嘅蚊數上限：</p><div class="row" id="limits">${[24,50,80,100].map(n=>`<button class="choice ${n===limit?'selected':''}" data-limit="${n}">${n}</button>`).join('')}</div>`}function bindLimits(){document.querySelectorAll('[data-limit]').forEach(b=>b.addEventListener('click',()=>{limit=Number(b.dataset.limit);document.querySelectorAll('[data-limit]').forEach(x=>x.classList.toggle('selected',x===b));updateUI()}))}bindLimits();start.addEventListener('click',()=>{if(state==='board'){backBoard();return}if(state==='paused'){pauseGame();return}reset()});pause.addEventListener('click',pauseGame);sound.addEventListener('click',()=>{muted=!muted;sound.textContent=muted?'🔇 靜音':'🔊 音效';sound.setAttribute('aria-pressed',String(!muted));if(!muted)initAudio();setBuzz()});ranking.addEventListener('click',()=>{if(state==='board')backBoard();else showBoard()});function swat(e){if(state!=='playing')return;e.preventDefault();initAudio();const rect=canvas.getBoundingClientRect(),x=(e.clientX-rect.left)*W/rect.width,y=(e.clientY-rect.top)*H/rect.height;let hit=-1;for(let i=bugs.length-1;i>=0;i--){const b=bugs[i];if(Math.hypot(b.x-x,b.y-y)<b.r+11){hit=i;break}}if(hit>=0){const b=bugs.splice(hit,1)[0];effects.push({x:b.x,y:b.y,t:0,points:b.type.points,hit:true});score+=b.type.points;popSound(b.type.kind)}else effects.push({x,y,t:0,hit:false});updateUI()}canvas.addEventListener('pointerdown',swat,{passive:false});function drawBug(b,t){const r=b.r;ctx.save();ctx.translate(b.x,b.y);ctx.rotate(Math.atan2(b.vy,b.vx)+Math.PI/2);const flap=Math.sin(t*42+b.phase)*.4;ctx.fillStyle=b.type.wing;ctx.strokeStyle='#78958b';ctx.lineWidth=1;for(const s of [-1,1]){ctx.save();ctx.rotate(s*flap);ctx.beginPath();ctx.ellipse(s*r*.65,-r*.55,r*.55,r*.8,s*.5,0,Math.PI*2);ctx.fill();ctx.stroke();ctx.restore()}ctx.strokeStyle=b.type.body;ctx.lineWidth=1.5;for(const s of [-1,1])for(let i=0;i<3;i++){ctx.beginPath();ctx.moveTo(s*r*.4,i*r*.25);ctx.lineTo(s*r*1.05,(i-.2)*r*.65);ctx.stroke()}ctx.fillStyle=b.type.body;ctx.beginPath();ctx.ellipse(0,r*.5,r*.36,r*.72,0,0,Math.PI*2);ctx.fill();ctx.beginPath();ctx.arc(0,-r*.28,r*.55,0,Math.PI*2);ctx.fill();ctx.fillStyle='white';for(const s of [-1,1]){ctx.beginPath();ctx.arc(s*r*.23,-r*.43,r*.12,0,Math.PI*2);ctx.fill()}if(b.type.kind==='fast'){ctx.fillStyle='#ffd87d';ctx.fillRect(-r*.22,r*.4,r*.44,r*.25)}if(b.type.kind==='giant'){ctx.fillStyle='#e6c1ff';ctx.beginPath();ctx.arc(0,-r*.2,r*.16,0,Math.PI*2);ctx.fill()}ctx.restore()}function render(t){ctx.clearRect(0,0,W,H);ctx.fillStyle='#a2cfa566';for(let i=0;i<12;i++){const x=(i*131+31)%W,y=(i*79+63)%H;ctx.beginPath();ctx.arc(x,y,2.5,0,Math.PI*2);ctx.fill()}for(const b of bugs)drawBug(b,t);for(const e of effects){const a=Math.max(0,1-e.t/.45);ctx.globalAlpha=a;ctx.strokeStyle=e.hit?'#cf7845':'#648d72';ctx.lineWidth=e.hit?4:2;ctx.beginPath();ctx.arc(e.x,e.y,7+e.t*45,0,Math.PI*2);ctx.stroke();if(e.hit){ctx.fillStyle='#ad4e2b';ctx.font='bold 18px system-ui';ctx.textAlign='center';ctx.fillText('+'+e.points,e.x,e.y-20-e.t*30)}ctx.globalAlpha=1}}function frame(ts){const dt=Math.min((ts-last)/1000||0,.05);last=ts;if(state==='playing'){elapsed+=dt;spawnClock+=dt;const interval=Math.max(.19,2.15-elapsed*.028);while(spawnClock>=interval){spawnClock-=interval;spawn();if(elapsed>35&&Math.random()<.22)spawn()}for(const b of bugs){b.phase+=dt*b.wiggle;b.x+=(b.vx+Math.sin(b.phase*3)*12)*dt;b.y+=(b.vy+Math.cos(b.phase*2.5)*12)*dt;if(b.x<b.r){b.x=b.r;b.vx=Math.abs(b.vx)}if(b.x>W-b.r){b.x=W-b.r;b.vx=-Math.abs(b.vx)}if(b.y<b.r){b.y=b.r;b.vy=Math.abs(b.vy)}if(b.y>H-b.r){b.y=H-b.r;b.vy=-Math.abs(b.vy)}}effects.forEach(e=>e.t+=dt);effects=effects.filter(e=>e.t<.45);updateUI();if(bugs.length>=limit)finish();setBuzz()}render(ts/1000);requestAnimationFrame(frame)}document.addEventListener('visibilitychange',()=>{if(document.hidden&&state==='playing')pauseGame()});resize();updateUI();requestAnimationFrame(frame)})();
</script></body></html>

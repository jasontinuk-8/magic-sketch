<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#244a3d"><title>Mosquito Attack — 打蚊大作戰</title><style>*{box-sizing:border-box}body{margin:0;background:#18382f;color:#f8f3dc;font-family:system-ui,-apple-system,sans-serif;overflow:hidden;touch-action:none}.app{height:100dvh;display:flex;flex-direction:column;max-width:1000px;margin:auto;padding:10px;gap:8px}.top{display:flex;justify-content:space-between;align-items:center;gap:8px}.brand{font-weight:900;letter-spacing:.5px;font-size:clamp(16px,4vw,25px)}.stats{display:flex;gap:8px}.stat{background:#30594a;padding:5px 10px;border-radius:10px;text-align:center;min-width:60px}.stat small{display:block;font-size:10px;opacity:.75}.stat b{font-variant-numeric:tabular-nums}.stage{position:relative;flex:1;min-height:0;background:linear-gradient(155deg,#e6f2d8,#c5e4c7);border:5px solid #729b79;border-radius:18px;overflow:hidden;touch-action:none}canvas{display:block;width:100%;height:100%;touch-action:none}.overlay{position:absolute;inset:0;background:#12382bd9;display:flex;align-items:center;justify-content:center;text-align:center;padding:20px}.panel{max-width:340px}.panel h1{font-size:clamp(26px,7vw,42px);margin:0 0 10px}.panel p{line-height:1.6}.btn{border:0;border-radius:12px;background:#f1bf63;color:#26392c;font-weight:900;font-size:18px;padding:14px 26px;cursor:pointer;touch-action:manipulation}.bottom{display:flex;justify-content:space-between;align-items:center;gap:10px}.hint{font-size:12px;color:#d9e8d7}.secondary{background:#426c59;color:#fff;padding:9px 13px;font-size:13px}.hidden{display:none!important}@media(max-width:550px){.app{padding:6px;gap:5px}.brand{font-size:15px}.stat{min-width:48px;padding:4px 6px}.stat small{font-size:9px}.bottom{font-size:11px}.hint{max-width:65%}}@media(orientation:landscape) and (max-height:480px){.top{height:34px}.brand{font-size:15px}.stat{padding:2px 9px}.bottom{height:28px}.secondary{padding:5px 9px}.app{gap:3px}}</style></head><body><main class="app"><header class="top"><div class="brand">🦟 MOSQUITO ATTACK</div><div class="stats"><div class="stat"><small>SCORE</small><b id="score">0</b></div><div class="stat"><small>TIME</small><b id="time">0s</b></div><div class="stat"><small>BEST</small><b id="best">0</b></div><div class="stat"><small>蚊</small><b id="count">0/24</b></div></div></header><section class="stage" id="stage"><canvas id="canvas"></canvas><div class="overlay" id="overlay"><div class="panel"><h1 id="headline">打蚊大作戰</h1><p id="description">用手指點擊飛緊嘅蚊！<br>開始得少少，之後越來越多、越飛越快。<br>畫面累積 24 隻蚊就 Game Over。</p><button class="btn" id="start">▶ START</button></div></div></section><footer class="bottom"><span class="hint">👆 點蚊 +10 分 · 打空唔扣分 · 越玩越難</span><button class="btn secondary" id="pause">暫停</button></footer></main><script>
(()=>{'use strict';const canvas=document.querySelector('#canvas'),ctx=canvas.getContext('2d'),stage=document.querySelector('#stage'),overlay=document.querySelector('#overlay'),headline=document.querySelector('#headline'),description=document.querySelector('#description'),start=document.querySelector('#start'),pause=document.querySelector('#pause'),scoreEl=document.querySelector('#score'),timeEl=document.querySelector('#time'),bestEl=document.querySelector('#best'),countEl=document.querySelector('#count');let W=0,H=0,dpr=1,bugs=[],effects=[],score=0,elapsed=0,spawnClock=0,last=0,state='menu',best=0;try{best=Number(localStorage.getItem('mosquito-best')||0)}catch{}bestEl.textContent=best;const rand=(a,b)=>a+Math.random()*(b-a);function resize(){const r=stage.getBoundingClientRect();W=r.width-10;H=r.height-10;dpr=Math.min(devicePixelRatio||1,2);canvas.width=Math.max(1,Math.round(W*dpr));canvas.height=Math.max(1,Math.round(H*dpr));ctx.setTransform(dpr,0,0,dpr,0,0);bugs.forEach(b=>{b.x=Math.max(20,Math.min(W-20,b.x));b.y=Math.max(20,Math.min(H-20,b.y))})}new ResizeObserver(resize).observe(stage);function spawn(){const r=rand(13,19),side=Math.floor(rand(0,4));let x=side===0?-r:side===1?W+r:rand(r,W-r),y=side===2?-r:side===3?H+r:rand(r,H-r);let a=Math.atan2(H/2-y,W/2-x)+rand(-.8,.8),speed=rand(48,78)+Math.min(115,elapsed*1.6);bugs.push({x,y,vx:Math.cos(a)*speed,vy:Math.sin(a)*speed,r,phase:rand(0,7),wiggle:rand(1.8,3.5)})}function reset(){bugs=[];effects=[];score=0;elapsed=0;spawnClock=0;state='playing';overlay.classList.add('hidden');pause.textContent='暫停';for(let i=0;i<2;i++)spawn();updateUI()}function updateUI(){scoreEl.textContent=score;timeEl.textContent=Math.floor(elapsed)+'s';countEl.textContent=bugs.length+'/24';bestEl.textContent=best}function finish(){state='over';headline.textContent='GAME OVER!';description.innerHTML=`你打中咗 <b>${score/10}</b> 隻蚊！<br>得分：<b>${score}</b> · 生存：<b>${Math.floor(elapsed)} 秒</b><br>再試一次，挑戰最高分！`;start.textContent='↻ 再玩一次';overlay.classList.remove('hidden')}function togglePause(){if(state==='playing'){state='paused';headline.textContent='已暫停';description.textContent='準備好就繼續打蚊！';start.textContent='▶ 繼續';overlay.classList.remove('hidden');pause.textContent='繼續'}else if(state==='paused'){state='playing';overlay.classList.add('hidden');pause.textContent='暫停'}}start.addEventListener('click',()=>{if(state==='paused')togglePause();else reset()});pause.addEventListener('click',togglePause);function swat(e){if(state!=='playing')return;e.preventDefault();const rect=canvas.getBoundingClientRect(),x=(e.clientX-rect.left)*W/rect.width,y=(e.clientY-rect.top)*H/rect.height;let hit=-1;for(let i=bugs.length-1;i>=0;i--){const b=bugs[i];if(Math.hypot(b.x-x,b.y-y)<b.r+13){hit=i;break}}if(hit>=0){const b=bugs.splice(hit,1)[0];effects.push({x:b.x,y:b.y,t:0,hit:true});score+=10;if(score>best){best=score;try{localStorage.setItem('mosquito-best',best)}catch{}}}else effects.push({x,y,t:0,hit:false});updateUI()}canvas.addEventListener('pointerdown',swat,{passive:false});function drawBug(b,t){ctx.save();ctx.translate(b.x,b.y);ctx.rotate(Math.atan2(b.vy,b.vx)+Math.PI/2);const flap=Math.sin(t*36+b.phase)*.35;ctx.fillStyle='#c5d7d7b9';ctx.strokeStyle='#718e87';ctx.lineWidth=1;ctx.save();ctx.rotate(flap);ctx.beginPath();ctx.ellipse(-b.r*.65,-b.r*.55,b.r*.55,b.r*.8,-.5,0,Math.PI*2);ctx.fill();ctx.stroke();ctx.restore();ctx.save();ctx.rotate(-flap);ctx.beginPath();ctx.ellipse(b.r*.65,-b.r*.55,b.r*.55,b.r*.8,.5,0,Math.PI*2);ctx.fill();ctx.stroke();ctx.restore();ctx.strokeStyle='#3e4a3e';ctx.lineWidth=1.5;for(const s of [-1,1])for(let i=0;i<3;i++){ctx.beginPath();ctx.moveTo(s*b.r*.4,i*b.r*.25);ctx.lineTo(s*b.r*1.05,(i-.2)*b.r*.65);ctx.stroke()}ctx.fillStyle='#3e453d';ctx.beginPath();ctx.ellipse(0,b.r*.5,b.r*.36,b.r*.72,0,0,Math.PI*2);ctx.fill();ctx.beginPath();ctx.arc(0,-b.r*.28,b.r*.55,0,Math.PI*2);ctx.fill();ctx.fillStyle='#fff';for(const s of [-1,1]){ctx.beginPath();ctx.arc(s*b.r*.23,-b.r*.43,b.r*.12,0,Math.PI*2);ctx.fill()}ctx.restore()}function render(t){ctx.clearRect(0,0,W,H);ctx.fillStyle='#b4d5b555';for(let i=0;i<12;i++){let x=(i*131+31)%Math.max(W,1),y=(i*79+63)%Math.max(H,1);ctx.beginPath();ctx.arc(x,y,2.5,0,Math.PI*2);ctx.fill()}for(const b of bugs)drawBug(b,t);for(const e of effects){const alpha=Math.max(0,1-e.t/.45);ctx.globalAlpha=alpha;ctx.strokeStyle=e.hit?'#d97542':'#698d74';ctx.lineWidth=e.hit?4:2;ctx.beginPath();ctx.arc(e.x,e.y,7+e.t*45,0,Math.PI*2);ctx.stroke();if(e.hit){ctx.fillStyle='#ba5b30';ctx.font='bold 18px system-ui';ctx.textAlign='center';ctx.fillText('+10',e.x,e.y-20-e.t*30)}ctx.globalAlpha=1}}function frame(ts){const dt=Math.min((ts-last)/1000||0,.05);last=ts;if(state==='playing'){elapsed+=dt;spawnClock+=dt;const interval=Math.max(.22,2.1-elapsed*.028);while(spawnClock>=interval){spawnClock-=interval;spawn();if(elapsed>35&&Math.random()<.23)spawn()}for(const b of bugs){b.phase+=dt*b.wiggle;b.x+=(b.vx+Math.sin(b.phase*3)*12)*dt;b.y+=(b.vy+Math.cos(b.phase*2.5)*12)*dt;if(b.x<b.r){b.x=b.r;b.vx=Math.abs(b.vx)}if(b.x>W-b.r){b.x=W-b.r;b.vx=-Math.abs(b.vx)}if(b.y<b.r){b.y=b.r;b.vy=Math.abs(b.vy)}if(b.y>H-b.r){b.y=H-b.r;b.vy=-Math.abs(b.vy)}}effects.forEach(e=>e.t+=dt);effects=effects.filter(e=>e.t<.45);updateUI();if(bugs.length>=24)finish()}render(ts/1000);requestAnimationFrame(frame)}resize();requestAnimationFrame(frame)})();
</script></body></html>
